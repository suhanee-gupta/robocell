# Default factory cell: four arms on a 1.6 m square, sharing the space between them.
# Units: metres, seconds, degrees (angles are converted to radians on load).

[sim]
tick_s = 0.01
max_time_s = 3600.0

[tasks]
# Tasks arrive as a Poisson process; targets are uniform in this box, so some are unreachable.
arrival_rate_hz = 2.0
x = [-0.9, 2.5]
y = [-0.9, 2.5]
z = [0.0, 1.3]
# Priority levels 0..N-1 (higher is more urgent) and their relative weights.
priority_weights = [0.6, 0.3, 0.1]

[faults]
# Chance that a task execution suffers an arm fault part-way through the motion.
probability = 0.03
recovery_s = 2.0

[estop]
# Global E-stop presses (sim time) and how long until the operator resets.
global_at_s = [40.0, 120.0]
reset_after_s = 1.5

[[arms]]
name = "a"
base = [0.0, 0.0]
base_height = 0.4
links = [0.6, 0.5]
joint_min_deg = [-170.0, -20.0, -150.0]
joint_max_deg = [170.0, 110.0, 150.0]
max_vel_deg = [90.0, 70.0, 100.0]
max_acc_deg = [180.0, 140.0, 220.0]
home_deg = [-135.0, 60.0, -100.0]

[[arms]]
name = "b"
base = [1.6, 0.0]
base_height = 0.4
links = [0.6, 0.5]
joint_min_deg = [-170.0, -20.0, -150.0]
joint_max_deg = [170.0, 110.0, 150.0]
max_vel_deg = [90.0, 70.0, 100.0]
max_acc_deg = [180.0, 140.0, 220.0]
home_deg = [-45.0, 60.0, -100.0]

[[arms]]
name = "c"
base = [0.0, 1.6]
base_height = 0.4
links = [0.6, 0.5]
joint_min_deg = [-170.0, -20.0, -150.0]
joint_max_deg = [170.0, 110.0, 150.0]
max_vel_deg = [90.0, 70.0, 100.0]
max_acc_deg = [180.0, 140.0, 220.0]
home_deg = [135.0, 60.0, -100.0]

[[arms]]
# A longer, slower arm.
name = "d"
base = [1.6, 1.6]
base_height = 0.5
links = [0.7, 0.6]
joint_min_deg = [-170.0, -20.0, -150.0]
joint_max_deg = [170.0, 110.0, 150.0]
max_vel_deg = [70.0, 55.0, 80.0]
max_acc_deg = [140.0, 110.0, 160.0]
home_deg = [45.0, 60.0, -100.0]

# Shared zones: axis-aligned boxes where arm workspaces overlap.
[[zones]]
name = "center"
min = [0.55, 0.55, 0.0]
max = [1.05, 1.05, 1.0]

[[zones]]
name = "south"
min = [0.6, -0.4, 0.0]
max = [1.0, 0.3, 0.9]

[[zones]]
name = "north"
min = [0.6, 1.3, 0.0]
max = [1.0, 2.0, 0.9]

[[zones]]
name = "west"
min = [-0.4, 0.6, 0.0]
max = [0.3, 1.0, 0.9]

[[zones]]
name = "east"
min = [1.3, 0.6, 0.0]
max = [2.0, 1.0, 0.9]
